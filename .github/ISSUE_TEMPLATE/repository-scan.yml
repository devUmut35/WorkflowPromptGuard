name: Herkese açık depoyu tara / Scan a public repository
description: Yapay zekâ ajanı iş akışlarındaki güven sınırlarını denetleyin. / Inspect AI-agent workflow trust boundaries.
title: "[Scan]: "
labels:
  - scan-request
body:
  - type: markdown
    attributes:
      value: |
        **Ne işe yarar?** Herkese açık depolardaki `.github/workflows` dosyalarında AI ajanı güvenlik risklerini bulur.
        **Nasıl çalışır?** Kodu çalıştırmaz; dosyaları okur ve sonucu bu issue'ya yazar.
        **AI notu:** AI açıksa LLM7.io'ya yalnızca kısa, anonim bulgu özeti gider. Kod, token, issue metni ve depo bilgisi gönderilmez.

        **What it does:** Finds AI-agent security risks in `.github/workflows` files of public repositories.
        **How it works:** It never runs code; it reads files and posts the result to this issue.
        **AI note:** When enabled, LLM7.io receives only a short, anonymous findings summary. No code, token, issue text, or repository identity is sent.

  - type: dropdown
    id: language
    attributes:
      label: Rapor dili / Report language
      description: Bot yorumunun dilini seçin. / Choose the language of the bot comment.
      options:
        - Türkçe
        - English
      default: 0
    validations:
      required: true

  - type: input
    id: repository
    attributes:
      label: Herkese açık GitHub deposunun URL'si / Public GitHub repository URL
      description: Tek bir herkese açık depo URL'si girin; dal ve alt dizin adresleri kabul edilmez. / Enter one public repository URL; branches and subdirectories are not accepted.
      placeholder: https://github.com/OWNER/REPOSITORY
    validations:
      required: true

  - type: checkboxes
    id: acknowledgement
    attributes:
      label: Herkese açık rapor / Public report
      options:
        - label: Tarama sonucunun bu issue'da herkese açık yayımlanacağını anlıyorum. / I understand that the scan result will be posted publicly on this issue.
          required: true

  - type: checkboxes
    id: llm7_disclosure
    attributes:
      label: Harici yapay zekâ / External AI
      description: LLM7.io veri notunu onaylayın. / Acknowledge the LLM7.io data note.
      options:
        - label: AI açıksa LLM7.io'nun kısa bulgu özetini işlemesini onaylıyorum. / I understand LLM7.io may process the short findings summary when AI is enabled.
          required: true
